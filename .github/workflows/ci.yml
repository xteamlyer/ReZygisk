name: Untrusted CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  build:
    # INFO: Pinned rather than ubuntu-latest: the -latest label moves to 26.04
    #       in November 2026 on GitHub's schedule, and this build (NDK, GCC
    #       cross-toolchain, the Python scripts) should move when we choose to.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup NDK_PATH
        run: echo "NDK_PATH=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      # INFO: The packaging tools are Rust, so they are built before `make` -
      #       `make` calls the signer. Same commands the Trusted CI runs on main,
      #       so a pull request is judged by what will actually run there.
      - name: Setup Rust
        run: |
          rustup default "${RUST_TOOLCHAIN:-stable}"
          rustc --version

      - name: Build the tools
        run: make -C tools build-host

      - name: Build
        run: |
          make all -j$(nproc)

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          path: "build/out/VexZygisk-v*-release.zip"
          archive: false

      - name: Upload debug
        uses: actions/upload-artifact@v7
        with:
          path: "build/out/VexZygisk-v*-debug.zip"
          archive: false

  host-test:
    # INFO: Kept on the same image as the build job so the suite a pull request
    #       runs is the one that will run on main, on the same OS release.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # INFO: The same suite the Trusted CI runs on main, so a regression
      #       fails the pull request instead of the merge that follows it.
      - name: Host unit tests
        run: bash tests/host/run.sh

      - name: Setup Rust
        run: rustup default "${RUST_TOOLCHAIN:-stable}"

      # INFO: The tools' own tests. The signer in particular has a test that
      #       pins the exact bytes fed to Ed25519, which is the one thing a
      #       release cannot get wrong by compiling.
      - name: Tool unit tests
        run: make -C tools test-host
