name: Trusted CI

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Host unit tests
    # INFO: Pinned rather than ubuntu-latest for the same reason as the build
    #       job below; the two must agree so the suite a pull request runs is
    #       the one that runs here after the merge.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        # INFO: The host tests exercise in-tree sources only (the ELF reader,
        #       the mountinfo and APatch parsers), so neither the submodules
        #       nor the history of the build job are needed here. Keeping this
        #       job separate lets a broken test fail fast and loudly without
        #       costing the archives, and vice versa.
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Host unit tests
        # INFO: Shared with the Untrusted CI through tests/host/run.sh, so a
        #       pull request is judged by the very same commands that run here
        #       after the merge. The suite exercises in-tree sources only (the
        #       ELF reader, the mountinfo and APatch parsers), so neither the
        #       submodules nor the history the build job needs are checked out,
        #       which lets a broken test fail fast without costing the archives.
        run: bash tests/host/run.sh

  build:
    # INFO: Pinned rather than ubuntu-latest: the -latest label moves to 26.04
    #       in November 2026 on GitHub's schedule, and this build (NDK, GCC
    #       cross-toolchain, the Python scripts) should move when we choose to.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup keys
        env:
          private_key: ${{ secrets.ORG_PRIVATE_KEY }}
          public_key: ${{ secrets.ORG_PUBLIC_KEY }}
        run: |
          if [ -z "$private_key" ] || [ -z "$public_key" ]; then
            echo "Private or public key is not set."
          else
            echo "$private_key" | base64 -d > module/private_key
            echo "$public_key" | base64 -d > module/public_key
          fi

      - name: Setup NDK_PATH
        run: echo "NDK_PATH=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Build
        run: |
          make all -j$(nproc)
          make apatch -j$(nproc)
          make apatch-debug -j$(nproc)

      - name: Binary size budget
        run: python3 scripts/ci_size_budget.py build build-apatch

      - name: Generate update.json
        run: |
          python3 scripts/make_update_json.py --tree build --output build/out/update.json --pattern "VexZygisk-v*-release.zip"
          python3 scripts/make_update_json.py --tree build-apatch --output build-apatch/out/update-apatch.json --pattern "VexZygisk-APatch-v*-release.zip"

      - name: Upload update.json
        uses: actions/upload-artifact@v7
        with:
          name: update.json
          path: "build/out/update.json"
          archive: false

      - name: Upload APatch update.json
        uses: actions/upload-artifact@v7
        with:
          name: update-apatch.json
          path: "build-apatch/out/update-apatch.json"
          archive: false

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          path: "build/out/VexZygisk-v*-release.zip"
          archive: false

      - name: Upload APatch release
        uses: actions/upload-artifact@v7
        with:
          path: "build-apatch/out/VexZygisk-APatch-v*-release.zip"
          archive: false

      - name: Upload debug
        uses: actions/upload-artifact@v7
        with:
          path: "build/out/VexZygisk-v*-debug.zip"
          archive: false

      - name: Upload APatch debug
        uses: actions/upload-artifact@v7
        with:
          path: "build-apatch/out/VexZygisk-APatch-v*-debug.zip"
          archive: false

      - name: Publish artifacts to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # INFO: The bot exists only once its secrets do; until then this is
          #       a warning and the artifacts stay on the run page alone.
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "::warning::Telegram secrets not configured, skipping publish"
            exit 0
          fi

          zips=$(ls build/out/VexZygisk-v*-release.zip build/out/VexZygisk-v*-debug.zip \
                     build-apatch/out/VexZygisk-APatch-v*-release.zip \
                     build-apatch/out/VexZygisk-APatch-v*-debug.zip 2>/dev/null || true)
          if [ -z "$zips" ]; then
            echo "::error::No build zips found in build/out and build-apatch/out"
            exit 1
          fi

          escape_html() {
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
          }

          COMMIT_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$COMMIT_SHA"

          # INFO: The commit message quoted whole, the way the channel shows
          #       it, cut by characters (not bytes) and far enough ahead of
          #       Telegram's 1024-character caption limit that the escaping
          #       of the text below cannot push the caption over it.
          message=$(git log -1 --pretty=%B "$COMMIT_SHA" \
            | python3 -c "import sys; sys.stdout.write(sys.stdin.read().strip()[:600])" \
            | escape_html)

          echo "publishing from $(pwd)"
          ls -la build/out/ build-apatch/out/

          # INFO: Every zip of the build travels as ONE media group - a single
          #       message, one caption on its first item, the shape a channel
          #       reader expects a build to arrive in.
          count=0
          doc_args=()
          for zip in $zips; do
            doc_args+=(-F "doc$count=@$GITHUB_WORKSPACE/$zip")
            count=$((count + 1))
          done

          # INFO: The media list is written to a file by the interpreter and
          #       handed to curl with the "read the value from this file"
          #       form, because an inline JSON in the form value does not
          #       survive the field parser - Telegram answered every inline
          #       attempt with "can't parse media JSON object", while the
          #       identical JSON through a file parses and ships.
          CAPTION="<b>VexZygisk</b>"$'\n'"Run: #ci_$RUN_NUMBER"$'\n\n'"<blockquote>$message</blockquote>"$'\n\n'"<a href=\"$COMMIT_URL\">Commit</a>"$'\n'"<a href=\"$RUN_URL\">Workflow run</a>" \
            python3 -c 'import json, sys, os; n = int(sys.argv[1]); m = [{"type": "document", "media": "attach://doc%d" % i} for i in range(n)]; m[-1]["caption"] = os.environ["CAPTION"]; m[-1]["parse_mode"] = "HTML"; open(sys.argv[2], "w").write(json.dumps(m))' "$count" "$GITHUB_WORKSPACE/tg_media.json"

          curl_args=(-sS -o tg_response.json -w '%{http_code}'
                     --form-string "chat_id=$TG_CHAT_ID"
                     -F 'media=<tg_media.json'
                     "${doc_args[@]}")

          if [ -n "$TG_THREAD_ID" ]; then
            curl_args+=(--form-string "message_thread_id=$TG_THREAD_ID")
          fi

          curl_args+=("https://api.telegram.org/bot$TG_BOT_TOKEN/sendMediaGroup")

          # INFO: A Telegram hiccup must not fail a build that already
          #       produced its artifacts: warn and keep the delivery to the
          #       next run instead of failing the build over it.
          http=$(curl "${curl_args[@]}" 2>curl_err.txt) || http="curl-failed"

          if [ "$http" != "200" ]; then
            echo "::warning::Telegram upload failed ($http)"
            [ -s curl_err.txt ] && echo "::warning::curl: $(cat curl_err.txt)"
            [ -s tg_response.json ] && echo "::warning::Telegram said: $(head -c 400 tg_response.json)"
          else
            echo "Sent $count zips as one media group: $(head -c 160 tg_response.json)"
          fi
