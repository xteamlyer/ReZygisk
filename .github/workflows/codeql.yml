name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # INFO: A weekly sweep even when nothing is pushed, so a new advisory
    #       against an unchanged dependency still surfaces.
    - cron: "0 3 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # INFO: Pinned rather than ubuntu-latest, so this moves to 26.04 when the
    #       rest of the CI does.
    runs-on: ubuntu-26.04

    permissions:
      # INFO: Required by the analysis job: read the code, and let the CodeQL
      #       action write the results back as code-scanning alerts.
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ c-cpp, actions, python ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # INFO: C/C++ needs a build to be observed; the repository's own build
      #       would drag in the submodules and the NDK. Autobuild discovers the
      #       compile commands that matter for the traced sources, and the
      #       Python and Actions analyses do not build at all.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'c-cpp' && 'autobuild' || 'none' }}

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
